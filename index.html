    <title>Portfólio - D&L Personalizados</title>
    <!-- Ícone da aba do navegador -->
    <link rel="icon" href="https://github.com/DRLEdition19/portifolio_dl/blob/main/Logo%20DS%20com%20elipse.png?raw=true">
    <style>
        /* Remove todas as margens para o site ocupar 100% da tela */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barra de rolagem dupla */
            background-color: #faf8f5; /* Cor de fundo enquanto carrega */
        }
        
        /* Configura o iframe para tela cheia e sem bordas */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
